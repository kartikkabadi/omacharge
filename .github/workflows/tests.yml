name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_model.js
      - run: python3 -m py_compile backend.py client.py system/install.py
      - run: bash -n install.sh setup.sh uninstall.sh system/sleep-hook
